version: 2
updates:
  # global.json -> sdk.version. Dependabot's dotnet-sdk updater is the only native
  # ecosystem that understands this file; NuGet does not read global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    # main requires branches to be up to date, so a stale bump is unmergeable.
    # Let Dependabot rebase itself instead of clicking "Update branch" per PR.
    rebase-strategy: auto
    commit-message:
      prefix: sdk
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # main requires branches to be up to date, so a stale bump is unmergeable.
    # Let Dependabot rebase itself instead of clicking "Update branch" per PR.
    rebase-strategy: auto
    commit-message:
      prefix: ci
    labels:
      - dependencies
