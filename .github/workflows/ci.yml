name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Setup must be a dry run: it may not install anything on a CI box.
      # On a bare runner this exits 0 after printing the plan.
      - name: setup.sh --dry-run
        run: ./setup.sh --dry-run

      # Linting is OS-independent, so run it once instead of paying `brew install
      # shellcheck` on the macOS leg.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck --version | head -2
          shellcheck -s sh setup.sh
          shellcheck -s sh bootstrap.sh
          shellcheck -s sh update.sh

      # Ensures the cold-start path still works when the script is piped, which is the
      # only way it will ever be run on a bare machine.
      - name: bootstrap.sh survives being piped
        run: |
          out="$(cat bootstrap.sh | sh -s -- --dry-run)"
          echo "$out"
          echo "$out" | grep -q 'would clone'

      # The shebang is #!/bin/sh and the guest /bin/sh is dash on Debian/Ubuntu,
      # so a bashism that works on macOS would only appear here.
      - name: dash -n (POSIX syntax)
        if: runner.os == 'Linux'
        run: dash -n setup.sh

  installer:
    name: installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # install.cs applies only from the canonical checkout; on a runner that is
    # the workspace, not ~/dotfiles.
    env:
      DOTFILES_DIR: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: global.json satisfied
        run: |
          dotnet --version
          dotnet --version | grep -qE '^10\.'

      - name: install
        run: ./install.cs

      # The stamp/link pass must converge. A second run changing anything means
      # the install is not idempotent.
      - name: second run changes nothing
        run: |
          out="$(./install.cs)"
          echo "$out"
          echo "$out" | grep -q 'done (0 path(s) changed)'

      # Exit code is about blocking prerequisites only (dotnet, python3, git).
      # opencode/roslynk/PATH are advisory and must not fail the build.
      - name: doctor
        run: ./install.cs --doctor

      # Applying from anything but the canonical checkout must be refused
      # (2026-11-20: the live config pointed into a merged feature worktree for
      # 32 hours).
      - name: install refuses a non-canonical checkout
        run: python3 tests/install_root.py

      - name: managed paths are symlinks that resolve
        run: |
          set -eu
          for p in AGENTS.md opencode.json agents commands skills memory bin plugins; do
            test -L "$HOME/.config/opencode/$p" || { echo "not a symlink: $p"; exit 1; }
            test -e "$HOME/.config/opencode/$p" || { echo "broken: $p"; exit 1; }
          done
          test -L "$HOME/.local/bin/notify-bot" && test -e "$HOME/.local/bin/notify-bot"
          # v2 runs opencode only: a fresh install writes nothing into ~/.claude or ~/.grok.
          for p in .claude/CLAUDE.md .claude/commands .claude/skills .grok/AGENTS.md; do
            test ! -e "$HOME/$p" || { echo "a fresh install wrote ~/$p"; exit 1; }
          done
          for d in skills/*/; do
            n=$(basename "$d")
            test -f "$HOME/.config/opencode/skills/$n/SKILL.md" || { echo "not linked: ~/.config/opencode/skills/$n/SKILL.md"; exit 1; }
          done
          test -f "$HOME/.config/opencode/memory/INDEX.md"
          test -f "$HOME/.config/opencode/memory/core/conventions.md"
          test -f "$HOME/.config/opencode/memory/core/safety.md"
          test -f "$HOME/.config/opencode/memory/learnings/README.md"

      - name: vendored skills match their pin
        run: cd skills && shasum -a 256 -c UPSTREAM.sha256

      - name: python tools still parse
        run: python3 -m py_compile bin/models bin/notify-bot bin/setup-bot-webhooks

      - name: plugin, models and config tests
        run: |
          python3 tests/models.py
          python3 tests/guard_plugin.py
          python3 tests/opencode_config.py
          python3 tests/bot_webhooks.py

      - name: memory bookshelf
        run: |
          set -eu
          test -f memory/INDEX.md
          grep -q 'core/conventions.md' memory/INDEX.md
          grep -q 'core/safety.md' memory/INDEX.md
          grep -q 'learnings/README.md' memory/INDEX.md
          grep -q 'YYYY-MM-DD.md' memory/INDEX.md
          git check-ignore -q memory/learnings/2099-01-01.md
          git check-ignore -q memory/learnings/working.md
          if git check-ignore -q memory/learnings/README.md; then
            echo "README.md should stay tracked"
            exit 1
          fi
          if git check-ignore -q memory/learnings/.gitkeep; then
            echo ".gitkeep should stay tracked"
            exit 1
          fi

      # .gitignore only stops new files; a tracked file stays tracked.
      - name: no tracked file is ignored
        run: |
          set -eu
          bad="$(git ls-files -ci --exclude-standard)"
          if [ -n "$bad" ]; then echo "tracked but ignored:"; echo "$bad"; exit 1; fi
