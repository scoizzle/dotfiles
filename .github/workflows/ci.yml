name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Setup must be a dry run: it may not install anything on a CI box.
      # On a bare runner this exits 0 after printing the plan.
      - name: setup.sh --dry-run
        run: ./setup.sh --dry-run

      # Linting is OS-independent, so run it once instead of paying `brew install
      # shellcheck` on the macOS leg.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck --version | head -2
          shellcheck -s sh setup.sh
          shellcheck -s sh bootstrap.sh
          shellcheck -s sh update.sh
          shellcheck -s bash evals/run.sh
          shellcheck -s bash evals/run-grok.sh

      # Ensures the cold-start path still works when the script is piped, which is the
      # only way it will ever be run on a bare machine.
      - name: bootstrap.sh survives being piped
        run: |
          out="$(cat bootstrap.sh | sh -s -- --dry-run)"
          echo "$out"
          echo "$out" | grep -q 'would clone'

      # The shebang is #!/bin/sh and the guest /bin/sh is dash on Debian/Ubuntu,
      # so a bashism that works on macOS would only appear here.
      - name: dash -n (POSIX syntax)
        if: runner.os == 'Linux'
        run: dash -n setup.sh

  installer:
    name: installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: global.json satisfied
        run: |
          dotnet --version
          dotnet --version | grep -qE '^10\.'

      - name: install
        run: ./install.cs

      # The stamp/link pass must converge. A second run changing anything means
      # the install is not idempotent.
      - name: second run changes nothing
        run: |
          out="$(./install.cs)"
          echo "$out"
          echo "$out" | grep -q 'done (0 path(s) changed)'

      # Exit code is about blocking prerequisites only (dotnet, python3, git).
      # opencode/roslynk/PATH are advisory and must not fail the build.
      - name: doctor
        run: ./install.cs --doctor

      - name: managed paths are symlinks that resolve
        run: |
          set -eu
          for p in AGENTS.md opencode.json agents commands skills memory bin evals; do
            test -L "$HOME/.config/opencode/$p" || { echo "not a symlink: $p"; exit 1; }
            test -e "$HOME/.config/opencode/$p" || { echo "broken: $p"; exit 1; }
          done
          test -f "$HOME/.config/opencode/skills/roslynk-rules/SKILL.md"
          test -f "$HOME/.config/opencode/memory/INDEX.md"
          test -f "$HOME/.config/opencode/memory/core/conventions.md"
          test -f "$HOME/.config/opencode/memory/core/safety.md"
          test -f "$HOME/.config/opencode/memory/learnings/README.md"

      # A wrong skill header fails silently in opencode, so assert the contract:
      # name matches the directory and is a valid slug, description within bounds.
      - name: skill frontmatter valid
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("skills/roslynk-rules/SKILL.md")
          fm = p.read_text().split("---\n", 2)[1]
          f = {
              k: v
              for k, v in (
                  line.split(": ", 1)
                  for line in fm.strip().splitlines()
                  if ": " in line and not line.startswith((" ", "\t"))
              )
          }
          checks = {
              "name matches dir": f.get("name") == p.parent.name,
              "name is a slug": bool(re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", f.get("name", ""))),
              "description bound": 1 <= len(f.get("description", "")) <= 1024,
          }
          for k, v in checks.items():
              print(f"{'ok  ' if v else 'FAIL'} {k}")
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: python tools still parse
        run: python3 -m py_compile bin/review-bundle bin/review-log bin/smoke-workflow bin/dream evals/cost.py evals/score.py evals/scoreboard.py

      # Needs HEAD to exist, and is the same call AGENTS.md makes mid-audit.
      - name: review-bundle smoke
        run: |
          set -eu
          bundle="$(./bin/review-bundle .)"
          echo "bundle: $bundle"
          test -d "$bundle"
          test -f "$bundle/00-status.txt"
          test -f "$bundle/01-diffstat.txt"

      - name: review-bundle exit codes
        run: |
          set +e
          ./bin/review-bundle >/dev/null 2>&1; rc=$?
          [ "$rc" -eq 2 ] || { echo "no-args should be 2, got $rc"; exit 1; }
          ./bin/review-bundle . --nope >/dev/null 2>&1; rc=$?
          [ "$rc" -eq 2 ] || { echo "bad flag should be 2, got $rc"; exit 1; }
          ./bin/review-bundle /tmp >/dev/null 2>&1; rc=$?
          [ "$rc" -eq 2 ] || { echo "non-git should be 2, got $rc"; exit 1; }
          echo "exit codes ok"

      # Bookshelf plus dream with no session store. dream must exit 0 and name
      # the scoreboard path. A later step drives a fixture database.
      - name: memory bookshelf and dream empty
        run: |
          set -eu
          test -f memory/INDEX.md
          grep -q 'core/conventions.md' memory/INDEX.md
          grep -q 'core/safety.md' memory/INDEX.md
          grep -q 'learnings/README.md' memory/INDEX.md
          grep -q 'YYYY-MM-DD.md' memory/INDEX.md
          ./bin/dream --help >/dev/null
          out="$(./bin/dream --source opencode --dry-run --db "${RUNNER_TEMP:-/tmp}/no-such-opencode.db")"
          echo "$out"
          echo "$out" | grep -q 'nothing to append'
          echo "$out" | grep -q 'opencode.db'
          git check-ignore -q memory/learnings/2099-01-01.md
          if git check-ignore -q memory/learnings/README.md; then
            echo "README.md should stay tracked"
            exit 1
          fi
          if git check-ignore -q memory/learnings/.gitkeep; then
            echo ".gitkeep should stay tracked"
            exit 1
          fi

      # Fixture session store plus a stub `opencode` on PATH. Checks the append,
      # a dry run that does not write, duplicate suppression, and a hash mismatch
      # that refuses the write. Core stays empty.
      - name: dream fixture
        run: |
          set -eu
          root="$(mktemp -d)"
          db="$root/opencode.db"
          memory="$root/memory"
          mkdir -p "$memory/learnings" "$memory/core" "$root/bin"
          python3 - "$db" << 'PY'
          import json, sqlite3, sys, time
          db = sqlite3.connect(sys.argv[1])
          db.execute("""create table session_v2 (
            id text, title text, directory text, agent text,
            time_created integer, time_updated integer, idle_outcome text,
            parent_id text, cost real
          )""")
          db.execute("""create table session_message (
            id text, session_id text, type text, seq integer, data text
          )""")
          now = int(time.time() * 1000)
          db.execute(
              "insert into session_v2 values (?,?,?,?,?,?,?,?,?)",
              ("ses_test", "fix path", "/tmp/work", "build", now, now, "failed", None, 0.0),
          )
          for i in (1, 2):
              data = json.dumps({
                  "content": [{
                      "type": "tool",
                      "name": "shell",
                      "state": {
                          "status": "error",
                          "input": {"command": "cat missing/file.txt"},
                          "error": {"message": "No such file or directory: missing/file.txt"},
                      },
                  }]
              })
              db.execute(
                  "insert into session_message values (?,?,?,?,?)",
                  (f"msg_{i}", "ses_test", "assistant", i, data),
              )
          db.commit()
          PY
          cat > "$root/bin/opencode" << 'EOF'
          #!/usr/bin/env python3
          import json, os, pathlib, sys
          target = os.environ.get("DREAM_TAMPER")
          mark = os.environ.get("DREAM_TAMPER_MARK")
          if target:
              do = True
              if mark:
                  flag = pathlib.Path(mark)
                  if flag.exists():
                      do = False
                  else:
                      flag.write_text("once\n")
              if do:
                  path = pathlib.Path(target)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with path.open("a") as handle:
                      handle.write("\n## tampered\n- known: tampered during draft [harness]\n")
          text = "- known: missing/file.txt is not in the tree [harness]\n- never: cat missing/file.txt [loop]\nignore this prose\n"
          sys.stdout.write(json.dumps({"type": "text", "part": {"text": text}}) + "\n")
          EOF
          chmod 755 "$root/bin/opencode"
          day="$(python3 -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"))')"
          target="$memory/learnings/$day.md"

          set +e
          PATH="/usr/bin:/bin" ./bin/dream --source opencode --db "$db" --memory "$memory" --dry-run >"$root/no-opencode.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'opencode is not on PATH' "$root/no-opencode.txt"
          test ! -e "$target"

          PATH="$root/bin:$PATH" ./bin/dream --source opencode --db "$db" --memory "$memory" --dry-run >"$root/dry.txt"
          test ! -e "$target"
          grep -q 'known: missing/file.txt is not in the tree \[harness\]' "$root/dry.txt"
          grep -q 'never: cat missing/file.txt \[loop\]' "$root/dry.txt"
          test -z "$(find "$memory/core" -type f -print)"

          PATH="$root/bin:$PATH" ./bin/dream --source opencode --db "$db" --memory "$memory" >"$root/write.txt"
          grep -q "$target" "$root/write.txt"
          test "$(grep -c 'missing/file.txt is not in the tree' "$target")" = "1"
          test -z "$(find "$memory/core" -type f -print)"

          PATH="$root/bin:$PATH" ./bin/dream --source opencode --db "$db" --memory "$memory" >"$root/second.txt"
          grep -q 'no durable lessons' "$root/second.txt"
          test "$(grep -c 'missing/file.txt is not in the tree' "$target")" = "1"

          # An existing empty file must hash as sha256(b""), not as "absent".
          rm -f "$target"
          : > "$target"
          PATH="$root/bin:$PATH" ./bin/dream --source opencode --db "$db" --memory "$memory" >"$root/empty.txt"
          test "$(grep -c 'missing/file.txt is not in the tree' "$target")" = "1"

          python3 - "$memory" << 'PY'
          import importlib.machinery, importlib.util, sys
          from pathlib import Path
          loader = importlib.machinery.SourceFileLoader("dreammod", "bin/dream")
          spec = importlib.util.spec_from_loader(loader.name, loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          memory = Path(sys.argv[1])
          try:
              mod.assert_learnings_target(memory, memory / "core" / "2099-01-01.md")
          except SystemExit as exc:
              if "memory/core" not in str(exc):
                  raise SystemExit(f"unexpected refusal: {exc}")
          else:
              raise SystemExit("core write was allowed")
          PY

          rm -f "$target"
          DREAM_TAMPER="$target" DREAM_TAMPER_MARK="$root/once" \
            PATH="$root/bin:$PATH" ./bin/dream --source opencode --db "$db" --memory "$memory" >"$root/retry.txt"
          grep -q 'missing/file.txt is not in the tree' "$target"
          grep -q 'tampered during draft' "$target"

          rm -f "$target"
          set +e
          DREAM_TAMPER="$target" PATH="$root/bin:$PATH" \
            ./bin/dream --source opencode --db "$db" --memory "$memory" >"$root/refuse.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q 'refusing to append' "$root/refuse.txt"
          test "$(grep -c 'missing/file.txt is not in the tree' "$target" || true)" = "0"

      # T3 launches grok and claudeAgent threads that never land in
      # opencode.db. This proves the t3 source, the auto union, the skip of
      # t3-opencode threads already in opencode.db, and the pinned -m.
      - name: dream t3 source
        run: |
          set -eu
          root="$(mktemp -d)"
          mkdir -p "$root/memory/learnings" "$root/memory/core" "$root/bin"

          python3 - "$root/t3.db" << 'PY'
          import datetime, json, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.execute("""create table orchestration_v2_projection_provider_threads (
            provider_thread_id text primary key, thread_id text, provider text,
            status text, updated_at text, payload_json text
          )""")
          db.execute("""create table orchestration_v2_projection_messages (
            message_id text primary key, thread_id text, role text, created_at text, payload_json text
          )""")
          db.execute("""create table orchestration_v2_projection_turn_items (
            turn_item_id text primary key, thread_id text, provider_thread_id text,
            ordinal integer, type text, status text, payload_json text
          )""")
          now = datetime.datetime.now(datetime.timezone.utc)
          def stamp(minutes):
              return (now - datetime.timedelta(minutes=minutes)).strftime("%Y-%m-%dT%H:%M:%S.%f")[:-3] + "Z"
          # thread-shared carries two provider rows. The opencode item must be
          # counted once in t3 mode and skipped in auto, not swallowed by the
          # grok row that shares its thread_id. Timestamps are distinct so the
          # --sessions cap has a stable order.
          db.execute("insert into orchestration_v2_projection_provider_threads values (?,?,?,?,?,?)",
                     ("pt-grok", "thread-grok", "grok", "idle", stamp(2), "{}"))
          db.execute("insert into orchestration_v2_projection_provider_threads values (?,?,?,?,?,?)",
                     ("pt-oc", "thread-shared", "opencode", "idle", stamp(0),
                      json.dumps({"nativeThreadRef": {"driver": "opencode", "nativeId": "ses_bound"}})))
          db.execute("insert into orchestration_v2_projection_provider_threads values (?,?,?,?,?,?)",
                     ("pt-grok-shared", "thread-shared", "grok", "idle", stamp(1), "{}"))
          db.execute("insert into orchestration_v2_projection_provider_threads values (?,?,?,?,?,?)",
                     ("pt-dream", "thread-dream", "opencode", "idle", stamp(0),
                      json.dumps({"nativeThreadRef": {"driver": "opencode", "nativeId": "ses_dream"}})))
          db.execute("insert into orchestration_v2_projection_provider_threads values (?,?,?,?,?,?)",
                     ("pt-oc2", "thread-oc2", "opencode", "idle", stamp(0),
                      json.dumps({"nativeThreadRef": {"driver": "opencode", "nativeId": "ses_bound"}})))
          db.execute("insert into orchestration_v2_projection_provider_threads values (?,?,?,?,?,?)",
                     ("pt-oc3", "thread-oc3", "opencode", "idle", stamp(0),
                      json.dumps({"nativeThreadRef": {"driver": "opencode", "nativeId": "ses_unbound"}})))
          for i in (1, 2):
              db.execute(
                  "insert into orchestration_v2_projection_turn_items values (?,?,?,?,?,?,?)",
                  (f"item-{i}", "thread-grok", "pt-grok", i, "command_execution", "failed",
                   json.dumps({"input": "cat missing/file.txt",
                               "output": "No such file or directory: missing/file.txt",
                               "exitCode": 1})),
              )
          db.execute(
              "insert into orchestration_v2_projection_turn_items values (?,?,?,?,?,?,?)",
              ("item-oc", "thread-shared", "pt-oc", 3, "command_execution", "failed",
               json.dumps({"input": "cat missing/t3-only.txt",
                           "output": "No such file or directory: missing/t3-only.txt",
                           "exitCode": 1})),
          )
          db.execute(
              "insert into orchestration_v2_projection_turn_items values (?,?,?,?,?,?,?)",
              ("item-grok-shared", "thread-shared", "pt-grok-shared", 1, "command_execution", "completed",
               json.dumps({"input": "echo ok", "output": "ok", "exitCode": 0})),
          )
          db.execute(
              "insert into orchestration_v2_projection_turn_items values (?,?,?,?,?,?,?)",
              ("item-dream", "thread-dream", "pt-dream", 1, "command_execution", "failed",
               json.dumps({"input": "cat missing/dream-only.txt",
                           "output": "No such file or directory: missing/dream-only.txt",
                           "exitCode": 1})),
          )
          db.execute(
              "insert into orchestration_v2_projection_messages values (?,?,?,?,?)",
              ("msg-1", "thread-grok", "user", stamp(2), json.dumps({"text": "please fix it"})),
          )
          db.commit()
          PY

          cat > "$root/bin/opencode" << 'EOF'
          #!/usr/bin/env python3
          import json, os, sys
          with open(os.environ["DREAM_ARGV"], "w") as handle:
              handle.write(" ".join(sys.argv[1:]))
          sys.stdout.write(json.dumps({"type": "text", "part": {"text": "- known: missing/file.txt is absent [loop]\n"}}) + "\n")
          EOF
          chmod 755 "$root/bin/opencode"

          DREAM_ARGV="$root/argv-t3.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source t3 --t3-db "$root/t3.db" --db "$root/absent.db" \
            --memory "$root/memory" --dry-run > "$root/t3.txt"
          grep -q 'known: missing/file.txt is absent \[loop\]' "$root/t3.txt"
          grep -q -- '-m opencode-go/deepseek-v4.1-flash' "$root/argv-t3.txt"
          test "$(find "$root/memory/learnings" -name '*.md' | wc -l | tr -d ' ')" = "0"

          DREAM_ARGV="$root/argv-auto.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source auto --t3-db "$root/t3.db" --db "$root/absent.db" \
            --memory "$root/memory" --dry-run > "$root/auto.txt" 2> "$root/auto.err"
          grep -q 'known: missing/file.txt is absent \[loop\]' "$root/auto.txt"
          grep -q 't3=' "$root/auto.err"

          if DREAM_ARGV="$root/argv-none.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source t3 --t3-db "$root/no-t3.db" --db "$root/absent.db" \
            --memory "$root/memory" --dry-run > "$root/none.txt" 2>&1; then
            echo "missing t3 store should fail in t3 mode"
            exit 1
          fi
          grep -q 'no t3 store' "$root/none.txt"

          ./bin/dream --help | grep -q -- '--source'
          ./bin/dream --help | grep -q -- '--t3-db'
          ./bin/dream --help | grep -q -- '--model'

          python3 - "$root/oc.db" << 'PY'
          import datetime, json, sqlite3, sys
          oc = sqlite3.connect(sys.argv[1])
          oc.execute("""create table session_v2 (
            id text, title text, directory text, agent text, time_created integer,
            time_updated integer, idle_outcome text, parent_id text, cost real
          )""")
          oc.execute("""create table session_message (
            id text, session_id text, type text, seq integer, data text
          )""")
          now = int(datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000)
          for sid in ("ses_bound", "ses_unbound"):
              oc.execute("insert into session_v2 values (?,?,?,?,?,?,?,?,?)",
                         (sid, sid, "/tmp/work", "build", now, now, "failed", None, 0.0))
              for i in (1, 2):
                  data = json.dumps({"content": [{"type": "tool", "name": "shell", "state": {
                      "status": "error", "input": {"command": "cat missing/file.txt"},
                      "error": {"message": "No such file or directory: missing/file.txt"}}}]})
                  oc.execute("insert into session_message values (?,?,?,?,?)",
                             (f"{sid}-msg-{i}", sid, "assistant", i, data))
          oc.execute("insert into session_v2 values (?,?,?,?,?,?,?,?,?)",
                     ("ses_dream", "dream", "/tmp/work", "build", now, now, "failed", None, 0.0))
          oc.execute("insert into session_message values (?,?,?,?,?)",
                     ("ses_dream-msg", "ses_dream", "assistant", 1,
                      json.dumps({"content": [{"type": "text", "text": "DREAM-PASS"}]})))
          oc.commit()
          PY

          DREAM_ARGV="$root/argv-dedupe.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source auto --t3-db "$root/t3.db" --db "$root/oc.db" \
            --memory "$root/memory" --dry-run > "$root/dedupe.txt" 2> "$root/dedupe.err"
          grep -q 't3-opencode-skipped=4' "$root/dedupe.err"
          grep -q 'unbound-opencode=0' "$root/dedupe.err"
          grep -q 't3=2 ' "$root/dedupe.err"
          test "$(grep -o 'ses_bound' "$root/dedupe.txt" | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'ses_unbound' "$root/dedupe.txt" | wc -l | tr -d ' ')" = "1"
          if grep -q -e 't3-only' -e 'dream-only' "$root/argv-dedupe.txt"; then
            echo "auto swallowed an item from a skipped t3 opencode mirror"
            exit 1
          fi

          # Bound opencode mirrors must not consume --sessions and starve the
          # grok/claudeAgent rows: four newer mirrors against a cap of four
          # would otherwise fill the T3 query and leave nothing to read.
          DREAM_ARGV="$root/argv-cap.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source auto --sessions 4 --t3-db "$root/t3.db" --db "$root/oc.db" \
            --memory "$root/memory" --dry-run > "$root/cap.txt" 2> "$root/cap.err"
          grep -q 't3=2 ' "$root/cap.err"
          grep -q 'missing/file.txt' "$root/argv-cap.txt"

          DREAM_ARGV="$root/argv-t3all.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source t3 --t3-db "$root/t3.db" \
            --db "$root/absent.db" --memory "$root/memory" --dry-run \
            > "$root/t3all.txt" 2> "$root/t3all.err"
          grep -q 't3=6 ' "$root/t3all.err"
          grep -q 'missing/t3-only.txt (1)' "$root/argv-t3all.txt"
          if grep -q '2× shell: No such file or directory: missing/t3-only.txt' "$root/argv-t3all.txt"; then
            echo "shared thread_id duplicated an item"
            exit 1
          fi

          printf 'not a database\n' > "$root/bad.sqlite"
          DREAM_ARGV="$root/argv-bad.txt" PATH="$root/bin:$PATH" \
            ./bin/dream --source auto --t3-db "$root/bad.sqlite" --db "$root/absent.db" \
            --memory "$root/memory" --dry-run > "$root/bad.txt" 2> "$root/bad.err"
          grep -q 'not recognised' "$root/bad.err"

          python3 - << 'PY'
          import importlib.machinery, importlib.util
          loader = importlib.machinery.SourceFileLoader("dreammod", "bin/dream")
          spec = importlib.util.spec_from_loader(loader.name, loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          assert mod.t3_event("subagent", "failed", {"title": "delegate failed"})["status"] == "error"
          err = mod.t3_event(
              "dynamic_tool", "failed",
              {"toolName": "Read", "input": {"path": "a"},
               "output": {"output_for_prompt": "File not found: /tmp/missing/a"}},
          )["error"]
          assert err == "No such file or directory: /tmp/missing/a", err
          assert mod.t3_event("command_execution", "interrupted", {"input": "make"})["status"] == "interrupted"
          assert mod.t3_event("command_execution", "completed", {"input": "make", "exitCode": 1})["status"] == "error"
          PY
