name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: shell / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: sh -n
        run: sh -n install.sh
      - name: vendored skills match their pin
        run: cd skills && shasum -a 256 -c UPSTREAM.sha256

  installer:
    name: installer / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install, then --check finds nothing to change
        run: |
          set -eu
          repo="$(pwd -P)"
          home="$(mktemp -d)"
          mkdir -p "$home/.claude/skills/someone-elses"
          echo old > "$home/.claude/CLAUDE.md"
          HOME="$home" FORCE=1 ./install.sh
          for p in .config/opencode/AGENTS.md:AGENTS.md .config/opencode/opencode.json:opencode.json .claude/CLAUDE.md:AGENTS.md; do
            test "$(readlink "$home/${p%%:*}")" = "$repo/${p#*:}" || { echo "not linked: ${p%%:*}"; exit 1; }
          done
          for d in skills/*/; do
            n="$(basename "$d")"
            for dst in .config/opencode/skills .claude/skills; do
              test "$(readlink "$home/$dst/$n")" = "$repo/skills/$n" || { echo "not linked: $dst/$n"; exit 1; }
            done
          done
          test -d "$home/.claude/skills/someone-elses" && test ! -L "$home/.claude/skills/someone-elses"
          ls "$home"/.config/dotfiles-backup-*/.claude/CLAUDE.md
          HOME="$home" ./install.sh --check
      - name: a real directory at a destination is refused, even with FORCE, and nothing changes
        run: |
          set -eu
          home="$(mktemp -d)"
          err="$(mktemp)"
          mkdir -p "$home/.claude/skills/run-tests"
          echo mine > "$home/.claude/skills/run-tests/SKILL.md"
          rc=0; HOME="$home" FORCE=1 ./install.sh 2>"$err" || rc=$?
          cat "$err"
          test "$rc" -eq 4
          grep -q "real directory" "$err"
          test ! -L "$home/.claude/skills/run-tests"
          test "$(cat "$home/.claude/skills/run-tests/SKILL.md")" = mine
          test ! -e "$home/.config/opencode"
          ! ls -d "$home"/.config/dotfiles-backup-* 2>/dev/null
          rc=0; HOME="$home" ./install.sh --check || rc=$?
          test "$rc" -eq 4
          home="$(mktemp -d)"
          mkdir -p "$home/.config/opencode/skills/run-tests"
          echo mine > "$home/.config/opencode/skills/run-tests/SKILL.md"
          rc=0; HOME="$home" FORCE=1 ./install.sh 2>"$err" || rc=$?
          cat "$err"
          test "$rc" -eq 4
          grep -q "real directory" "$err"
          test ! -L "$home/.config/opencode/skills/run-tests"
          test "$(cat "$home/.config/opencode/skills/run-tests/SKILL.md")" = mine
          test ! -e "$home/.config/opencode/AGENTS.md"
          ! ls -d "$home"/.config/dotfiles-backup-* 2>/dev/null
      - name: a skills folder that is a link to the repo (the old layout) is replaced, the repo untouched
        run: |
          set -eu
          repo="$(pwd -P)"
          home="$(mktemp -d)"
          mkdir -p "$home/.config/opencode"
          ln -s "$repo/skills" "$home/.config/opencode/skills"
          rc=0; HOME="$home" ./install.sh --check || rc=$?
          test "$rc" -eq 1
          HOME="$home" FORCE=1 ./install.sh
          test ! -L "$home/.config/opencode/skills" && test -d "$home/.config/opencode/skills"
          test "$(readlink "$home/.config/opencode/skills/run-tests")" = "$repo/skills/run-tests"
          test -z "$(git status --porcelain)"
          cd skills && shasum -a 256 -c UPSTREAM.sha256
      - name: no ~/.claude without Claude Code
        run: |
          set -eu
          home="$(mktemp -d)"
          HOME="$home" FORCE=1 ./install.sh
          test ! -e "$home/.claude"
      - name: another checkout is refused, and so is an unknown argument
        run: |
          set -eu
          home="$(mktemp -d)"
          rc=0; HOME="$home" ./install.sh || rc=$?
          test "$rc" -eq 3
          mkdir "$home/dotfiles"
          rc=0; HOME="$home" ./install.sh || rc=$?
          test "$rc" -eq 3
          test ! -e "$home/.config/opencode/AGENTS.md"
          rc=0; HOME="$home" FORCE=1 ./install.sh --dry-run || rc=$?
          test "$rc" -eq 2
          test ! -e "$home/.config/opencode"
